<!doctype html>
<html><body style="margin:0;background:#000">
<script type="module">
// SBN13th claymation bust. Clean, chunky plasticine forms, one soft studio light,
// pressed-clay backdrop. Query params: seed, bg, skin, mask, shirt, glow.
import * as THREE from './node_modules/three/build/three.module.js';

const P = Object.fromEntries(new URLSearchParams(location.search));
const SEED = +(P.seed || 7);
let s = SEED * 9973 % 2147483647 || 1; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
const SKIN = P.skin || '#c08a6c', MASKC = P.mask || '#e6dcc0', SHIRT = P.shirt || '#9a2420', BG = P.bg || '#d98f45';
const GLOW = P.glow || '#ff3a1a';

// ---------------- textures ----------------
function canvas(S) { const c = document.createElement('canvas'); c.width = c.height = S; return [c, c.getContext('2d')]; }
function clayBump() {               // soft smudges + faint fingerprints, like hand-worked plasticine
  const [c, g] = canvas(512); g.fillStyle = '#808080'; g.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 900; i++) {
    const x = rnd() * 512, y = rnd() * 512, r = 3 + rnd() * 14, v = rnd() < .5 ? 100 : 160;
    g.fillStyle = `rgba(${v},${v},${v},.10)`; g.beginPath(); g.ellipse(x, y, r, r * .5, rnd() * 3, 0, 7); g.fill();
  }
  g.strokeStyle = 'rgba(60,60,60,.10)'; g.lineWidth = 1;
  for (let i = 0; i < 25; i++) { const x = rnd() * 512, y = rnd() * 512, a = rnd() * 6;
    for (let k = 0; k < 7; k++) { g.beginPath(); g.ellipse(x, y, 5 + k * 3, 3.5 + k * 2.2, a, 0, 6.3); g.stroke(); } }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(2, 2); return t;
}
function pressedClay() {            // flattened plasticine sheet: thumb dents, prints, hairline cracks
  const [c, g] = canvas(1024); g.fillStyle = '#808080'; g.fillRect(0, 0, 1024, 1024);
  for (let i = 0; i < 45; i++) {
    const x = rnd() * 1024, y = rnd() * 1024, r = 30 + rnd() * 70;
    const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, 'rgba(50,50,50,.28)'); gr.addColorStop(1, 'rgba(50,50,50,0)');
    g.fillStyle = gr; g.beginPath(); g.ellipse(x, y, r, r * .75, rnd() * 3, 0, 7); g.fill();
    g.strokeStyle = 'rgba(40,40,40,.07)'; g.lineWidth = 1.4;
    for (let k = 2; k < 10; k++) { g.beginPath(); g.ellipse(x, y, k * r / 11, k * r / 15, .4, 0, 7); g.stroke(); }
  }
  g.strokeStyle = 'rgba(30,30,30,.35)'; g.lineWidth = 1.2;
  for (let i = 0; i < 22; i++) { let x = rnd() * 1024, y = rnd() * 1024; g.beginPath(); g.moveTo(x, y);
    for (let k = 0; k < 4; k++) { x += rnd() * 40 - 20; y += rnd() * 30; g.lineTo(x, y); } g.stroke(); }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(2, 2); return t;
}
function plaid(base) {
  const [c, g] = canvas(256), dark = '#1d1414';
  g.fillStyle = base; g.fillRect(0, 0, 256, 256);
  g.globalAlpha = .5; g.fillStyle = dark; g.fillRect(0, 96, 256, 64); g.fillRect(96, 0, 64, 256);
  g.globalAlpha = .25; g.fillRect(0, 16, 256, 18); g.fillRect(16, 0, 18, 256);
  g.globalAlpha = .45; g.fillStyle = '#e9d8ac'; g.fillRect(0, 126, 256, 4); g.fillRect(126, 0, 4, 256);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace; return t;
}
const BUMP = clayBump();
function clay(color, o = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: o.rough ?? .78, metalness: o.metal ?? 0, map: o.map || null,
    bumpMap: BUMP, bumpScale: o.bump ?? 1.2, side: o.side ?? THREE.FrontSide });
}

// ---------------- renderer, camera, light ----------------
const W = 1000;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, W); renderer.setPixelRatio(2);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(BG);
const cam = new THREE.PerspectiveCamera(26, 1, .1, 100); cam.position.set(0, .2, 12.5); cam.lookAt(0, -.2, 0);

scene.add(new THREE.HemisphereLight(0xfff4e8, 0x6a4a36, 1.0));
const key = new THREE.DirectionalLight(0xfff0de, 2.1); key.position.set(-3, 5, 8); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); key.shadow.radius = 10; key.shadow.bias = -.0015; key.shadow.normalBias = .03;
Object.assign(key.shadow.camera, { left: -5, right: 5, top: 5, bottom: -5, near: 1, far: 30 }); scene.add(key);
const fill = new THREE.DirectionalLight(0xdfe8ff, .8); fill.position.set(5, -1, 7); scene.add(fill);
const rim = new THREE.DirectionalLight(0xffe4c0, 1.2); rim.position.set(5, 4, -6); scene.add(rim);
const wall = new THREE.Mesh(new THREE.PlaneGeometry(40, 40),
  new THREE.MeshStandardMaterial({ color: BG, roughness: 1, bumpMap: pressedClay(), bumpScale: 9 }));
wall.position.z = -6; wall.receiveShadow = true; scene.add(wall);

function add(m, parent = scene) { m.castShadow = m.receiveShadow = true; parent.add(m); return m; }
function tube(pts, r, mat, parent, closed = false) {
  return add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts, closed), Math.max(32, pts.length * 4), r, 14, closed), mat), parent);
}

// ---------------- head: big swollen lobes that meet in creases ----------------
const head = new THREE.Group(); head.position.set(.2, .3, 0); head.rotation.set(.03, .72, 0); head.scale.setScalar(1.45); scene.add(head);
const dir = (x, y, z) => new THREE.Vector3(x, y, z).normalize();
const LOBES = [[dir(-.25, .55, -.8), .30, .42], [dir(.25, .95, -.15), .2, .36], [dir(-.85, .35, -.35), .2, .34],
  [dir(.7, .5, -.5), .22, .34], [dir(0, .15, -1), .24, .38], [dir(-.4, .9, .25), .14, .3], [dir(.45, .8, .35), .12, .28],
  [dir(-.6, -.05, -.75), .16, .3], [dir(.75, .05, -.6), .14, .3], [dir(-.1, .75, -.55), .2, .32]];
for (const l of LOBES) { l[1] *= .85 + rnd() * .3; l[0].add(new THREE.Vector3(rnd() - .5, rnd() - .5, rnd() - .5).multiplyScalar(.15)).normalize(); }
function headRadius(n) {
  let best = 0;
  for (const [d, a, w] of LOBES) best = Math.max(best, a * Math.exp(-(1 - n.dot(d)) / (w * w)));   // max -> creases between lobes
  return 1 + best;
}
const HEADGEO = (() => {
  const g = new THREE.SphereGeometry(1, 200, 150), p = g.attributes.position, n = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) {
    n.fromBufferAttribute(p, i).normalize();
    const r = headRadius(n);
    let x = n.x * r * .92, y = n.y * r, z = n.z * r;
    if (y < -.15) { const t = -.15 - y; x *= 1 - t * .45; if (z < 0) z *= 1 - t * .6; }   // jaw and the back of the neck taper
    if (z > .62) z = .62 + (z - .62) * .15;                                                   // flat face for the mask
    p.setXYZ(i, x, y, z);
  }
  g.computeVertexNormals(); return g;
})();
const HEADMESH = add(new THREE.Mesh(HEADGEO, clay(SKIN)), head);
head.updateMatrixWorld(true);

// cauliflower ear on the near side
{
  const ear = new THREE.Group(); ear.position.set(-.86, -.02, -.12); ear.rotation.set(0, -Math.PI / 2 + .25, .1); head.add(ear);
  const shell = add(new THREE.Mesh(new THREE.SphereGeometry(.2, 40, 30), clay(SKIN)), ear); shell.scale.set(.8, 1.25, .35);
  const rimE = add(new THREE.Mesh(new THREE.TorusGeometry(.17, .065, 18, 50, Math.PI * 1.55), clay(SKIN)), ear);
  rimE.rotation.z = Math.PI * .55; rimE.scale.set(.85, 1.2, 1); rimE.position.z = .03;
  if ((P.ear || 'gauged') === 'gauged') {
    const lobe = add(new THREE.Mesh(new THREE.TorusGeometry(.085, .045, 18, 40), clay(SKIN)), ear); lobe.position.set(-.02, -.3, .03); lobe.scale.set(1, 1.15, 1);
    const plug = add(new THREE.Mesh(new THREE.TorusGeometry(.075, .028, 18, 48), clay('#151515', { rough: .3, bump: .2 })), ear); plug.position.set(-.02, -.3, .035);
    const steel = add(new THREE.Mesh(new THREE.TorusGeometry(.052, .008, 10, 40), clay('#c9ccd0', { metal: .8, rough: .25, bump: .1 })), ear); steel.position.set(-.02, -.3, .06);
  } else add(new THREE.Mesh(new THREE.SphereGeometry(.075, 24, 18), clay(SKIN)), ear).position.set(-.02, -.22, .03);
  for (const [x, y] of [[.12, .12], [.15, -.02], [.06, .2]]) add(new THREE.Mesh(new THREE.SphereGeometry(.05, 16, 12), clay(SKIN)), ear).position.set(x, y, .06);
  const hole = add(new THREE.Mesh(new THREE.SphereGeometry(.06, 16, 12), clay(new THREE.Color(SKIN).multiplyScalar(.45))), ear); hole.position.set(-.02, -.02, .05); hole.scale.z = .4;
}

// ---------------- goalie mask: one outline drives the cut-out, the rim and the flesh seam ----------------
const MW = .5, MH = .66;                              // half width / half height in mask space
const OUT = [];                                       // outline (u, v), clockwise from the top
for (let i = 0; i < 160; i++) {
  const t = i / 160 * Math.PI * 2, x = Math.sin(t), y = Math.cos(t);
  const w = y > 0 ? 1 - .12 * y ** 4 : 1 - .42 * y * y;     // broad forehead, narrowing to the chin
  OUT.push([MW * .86 * x * w, MH * (y > 0 ? .92 : 1) * y]);
}
const HOLES = [   // laid out after George's mask photo: forehead columns and arcs, cheek clusters, chin rows
  [-.08, .5], [-.1, .38], [-.12, .26], [.08, .5], [.1, .38], [.12, .26],
  [-.25, .45], [-.32, .33], [-.36, .2], [.25, .45], [.32, .33], [.36, .2], [0, .2],
  [-.39, .02], [-.36, -.12], [-.29, -.2], [.39, .02], [.36, -.12], [.29, -.2],
  [-.22, -.33], [-.1, -.36], [.1, -.36], [.22, -.33], [-.15, -.46], [0, -.48], [.15, -.46], [-.07, -.58], [.07, -.58]];
const EYES = [[-.17, .06, .1, .075], [.17, .06, .1, .075]];
function shellZ(u, v) {
  let z = -1.05 * u * u - .55 * Math.max(0, v - .2) ** 2 - .8 * Math.max(0, -v - .15) ** 2;
  z += .2 * Math.exp(-(u * u / .006 + (v + .1) ** 2 / .026));                   // nose
  z += .045 * Math.exp(-((v - .16) ** 2 / .003)) * Math.exp(-u * u / .15);      // brow ridge
  for (const [eu, ev] of EYES) z -= .035 * Math.exp(-((u - eu) ** 2 + (v - ev) ** 2) / .007);
  z += .035 * Math.exp(-(u * u / .03 + (v + .5) ** 2 / .004));                  // chin ledge
  return z;
}
const MSIZE = 1024, MX = u => (u + MW) / (2 * MW) * MSIZE, MY = v => (1 - (v + MH) / (2 * MH)) * MSIZE;
function outlinePath(g) { g.beginPath(); OUT.forEach(([u, v], i) => i ? g.lineTo(MX(u), MY(v)) : g.moveTo(MX(u), MY(v))); g.closePath(); }
function maskAlpha(withHoles) {
  const [c, g] = canvas(MSIZE); g.fillStyle = '#000'; g.fillRect(0, 0, MSIZE, MSIZE); g.fillStyle = '#fff'; outlinePath(g); g.fill();
  if (withHoles) {
    g.fillStyle = '#000';
    for (const [u, v] of HOLES) { g.beginPath(); g.ellipse(MX(u), MY(v), 17, 17, 0, 0, 7); g.fill(); }
    g.beginPath(); g.ellipse(MX(0), MY(-.235), 12, 7, 0, 0, 7); g.fill();   // nostril under the nose
    for (const [u, v, rx, ry] of EYES) { g.beginPath(); g.ellipse(MX(u), MY(v), rx / (2 * MW) * MSIZE, ry / (2 * MH) * MSIZE, 0, 0, 7); g.fill(); }
  }
  return new THREE.CanvasTexture(c);
}
function maskColour() {             // worn off-white with grime and one clean blood drip per eye
  const [c, g] = canvas(MSIZE); g.fillStyle = MASKC; g.fillRect(0, 0, MSIZE, MSIZE);
  for (let i = 0; i < 70; i++) { g.fillStyle = `rgba(110,85,50,${.03 + rnd() * .05})`; g.beginPath(); g.ellipse(rnd() * MSIZE, rnd() * MSIZE, 20 + rnd() * 60, 10 + rnd() * 30, rnd() * 3, 0, 7); g.fill(); }
  g.fillStyle = '#7d1010';
  for (const [u, v] of EYES) { const x = MX(u) + 6, y = MY(v) + 62, L = 110 + rnd() * 90;
    g.beginPath(); g.roundRect(x - 8, y, 16, L, 8); g.fill(); g.beginPath(); g.arc(x, y + L, 13, 0, 7); g.fill(); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
function shellGeo(dz) {
  const g = new THREE.PlaneGeometry(2 * MW, 2 * MH, 160, 200), p = g.attributes.position;
  for (let i = 0; i < p.count; i++) { const u = p.getX(i), v = p.getY(i); p.setZ(i, shellZ(u, v) + dz); }
  g.computeVertexNormals(); return g;
}
const mask = new THREE.Group(); mask.position.set(0, -.04, .9); mask.scale.set(1.3, 1.2, 1.2); head.add(mask);
const shellMat = Object.assign(clay(MASKC, { map: maskColour(), rough: .6, bump: .7, side: THREE.DoubleSide }), { alphaMap: maskAlpha(true), alphaTest: .5 });
add(new THREE.Mesh(shellGeo(0), shellMat), mask);
add(new THREE.Mesh(shellGeo(-.035), Object.assign(new THREE.MeshStandardMaterial({ color: '#140c0a', roughness: 1, side: THREE.DoubleSide }),
  { alphaMap: maskAlpha(false), alphaTest: .5 })), mask);
// rounded thick rim around the outline
const rimPts = OUT.map(([u, v]) => new THREE.Vector3(u, v, shellZ(u, v) - .015));
tube(rimPts, .024, clay(MASKC, { rough: .6, bump: .5 }), mask, true);
// glowing eyes in the dark behind the eye holes
for (const [u, v] of EYES) {
  const e = new THREE.Mesh(new THREE.SphereGeometry(.05, 24, 16), new THREE.MeshStandardMaterial({ color: GLOW, emissive: GLOW, emissiveIntensity: 4 }));
  e.position.set(u + .015, v - .005, shellZ(u, v) - .065); mask.add(e);
  const l = new THREE.PointLight(GLOW, .35, .5); l.position.copy(e.position); mask.add(l);
}
// swollen flesh grown over the near edge of the mask, with a raw seam
{
  const near = OUT.filter(([u, v]) => u < -.2 && v > -.35 && v < .5).sort((a, b) => b[1] - a[1]);
  const flesh = near.map(([u, v], i) => new THREE.Vector3(u - .012, v, shellZ(u, v) + .005));
  tube(flesh.map(p => p.clone().add(new THREE.Vector3(.03, 0, .004))), .016, clay('#6a0f0f', { rough: .35, bump: .3 }), mask);
  tube(flesh, .03, clay(SKIN), mask);
}
// leather tabs with steel snaps where the straps meet the mask
const TABS = [[-.43, .2], [.43, .2], [0, .6], [-.33, -.42], [.33, -.42]];
for (const [u, v] of TABS) {
  const tab = add(new THREE.Mesh(new THREE.BoxGeometry(.1, .11, .025), clay('#1f1d1c', { rough: .85 })), mask);
  tab.position.set(u, v, shellZ(u, v) + .02); tab.rotation.y = -u * 1.6;
  const snap = add(new THREE.Mesh(new THREE.CylinderGeometry(.025, .025, .02, 24), clay('#c9ccd0', { metal: .8, rough: .3, bump: .1 })), mask);
  snap.position.set(u, v, shellZ(u, v) + .04); snap.rotation.set(Math.PI / 2, 0, 0); snap.rotation.y = -u * 1.6;
}

// ---------------- leather straps traced on the skull surface ----------------
const raycaster = new THREE.Raycaster();
function surfacePath(centre, normal, a0, a1, n = 120) {
  const N = normal.clone().normalize(), helper = Math.abs(N.y) > .9 ? new THREE.Vector3(1, 0, 0) : new THREE.Vector3(0, 1, 0);
  const e1 = helper.clone().cross(N).normalize(), e2 = N.clone().cross(e1).normalize(), out = [];
  const m = new THREE.Mesh(HEADGEO); m.updateMatrixWorld(true);
  for (let i = 0; i <= n; i++) {
    const t = a0 + (a1 - a0) * i / n, d = e1.clone().multiplyScalar(Math.cos(t)).add(e2.clone().multiplyScalar(Math.sin(t)));
    raycaster.set(centre.clone().add(d.clone().multiplyScalar(4)), d.clone().negate());
    const h = raycaster.intersectObject(m)[0]; if (h) out.push([h.point, h.face.normal.clone()]);
  }
  return out;
}
function strap(path, w = .07, t = .03) {
  // flat leather band (rectangular section) with stitched edges, swollen flesh rolls either side
  const pos = [], idx = [], L = [], R = [];
  path.forEach(([p, nrm], i) => {
    const nx = path[Math.min(i + 1, path.length - 1)][0], pv = path[Math.max(i - 1, 0)][0];
    const T = nx.clone().sub(pv).normalize(), B = T.clone().cross(nrm).normalize();
    const base = p.clone().add(nrm.clone().multiplyScalar(-.004));
    const top = p.clone().add(nrm.clone().multiplyScalar(t));
    for (const q of [base.clone().addScaledVector(B, -w), top.clone().addScaledVector(B, -w), top.clone().addScaledVector(B, w), base.clone().addScaledVector(B, w)]) pos.push(q.x, q.y, q.z);
    L.push(p.clone().addScaledVector(B, -w - .02)); R.push(p.clone().addScaledVector(B, w + .02));
  });
  for (let i = 0; i < path.length - 1; i++) for (let k = 0; k < 3; k++) {
    const a = i * 4 + k, b = a + 1, c = a + 4, d = b + 4; idx.push(a, c, b, b, c, d);
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx); g.computeVertexNormals();
  add(new THREE.Mesh(g, clay('#1f1d1c', { rough: .85, side: THREE.DoubleSide })), head);
  tube(L, .028, clay(SKIN), head); tube(R, .028, clay(SKIN), head);
}
strap(surfacePath(new THREE.Vector3(0, .22, 0), new THREE.Vector3(0, 1, -.12), 0, Math.PI * 2, 200));
strap(surfacePath(new THREE.Vector3(0, 0, 0), new THREE.Vector3(1, 0, 0), .35, Math.PI * .92), .06);

// ---------------- neck, shirt ----------------
const SH = plaid(SHIRT);
add(new THREE.Mesh(new THREE.CylinderGeometry(.6, .7, 1.0, 40), clay(SKIN))).position.set(.05, -.7, -.05);
const body = new THREE.Group(); body.position.set(0, -1.05, -.25); body.rotation.y = .35; scene.add(body);
{
  const prof = new THREE.SplineCurve([[.6, .12], [.8, .04], [1.25, -.1], [1.7, -.4], [1.93, -.85], [2.0, -1.5], [2.0, -3]].map(([r, y]) => new THREE.Vector2(r, y))).getPoints(60);
  const tg = new THREE.LatheGeometry([new THREE.Vector2(0, .12), ...prof], 160); const t = SH.clone(); t.repeat.set(6, 3); t.needsUpdate = true;
  const torso = add(new THREE.Mesh(tg, clay('#fff', { map: t, bump: 1.4 })), body); torso.scale.set(1, 1, .62);
  const cm = clay('#fff', { map: (() => { const c = SH.clone(); c.repeat.set(2, 2); c.needsUpdate = true; return c; })(), bump: 1.4 });
  // two rolled collar points lying on the chest either side of the neck
  for (const sgn of [-1, 1]) {
    const sh = new THREE.Shape(); sh.moveTo(0, 0); sh.lineTo(.55, .05); sh.quadraticCurveTo(.45, -.3, .22, -.6); sh.closePath();
    const cg = new THREE.ExtrudeGeometry(sh, { depth: .03, bevelEnabled: true, bevelThickness: .04, bevelSize: .05, bevelSegments: 5, curveSegments: 12 });
    const c = add(new THREE.Mesh(cg, cm), body);
    c.position.set(sgn * .1, .02, .5); c.scale.set(sgn, 1, 1); c.rotation.set(-.35, sgn * .55, 0);
  }
  // button placket, buttons, pocket
  const front = add(new THREE.Mesh(new THREE.BoxGeometry(.16, 2.2, .04), cm), body); front.position.set(0, -1.4, 1.22); front.rotation.x = -.06;
  for (let i = 0; i < 3; i++) add(new THREE.Mesh(new THREE.SphereGeometry(.055, 20, 14), clay('#e9e1cf', { rough: .4 })), body).position.set(0, -.75 - i * .55, 1.25 + i * .04).multiplyScalar(1);
  const pocket = add(new THREE.Mesh(new THREE.BoxGeometry(.6, .62, .05, 4, 4, 1), cm), body); pocket.position.set(.85, -1.3, 1.08); pocket.rotation.y = .5;
}

// ---------------- right fist in front of the chest gripping a long rusty machete (George's photo) ----------------
const hand = new THREE.Group(); hand.position.set(.8, -2.1, 1.85); hand.rotation.set(0, -.15, -.42); scene.add(hand);
{
  const sm = clay('#fff', { map: (() => { const c = SH.clone(); c.repeat.set(3, 3); c.needsUpdate = true; return c; })(), bump: 1.4 });
  const wrist = add(new THREE.Mesh(new THREE.CylinderGeometry(.3, .33, .7, 30), clay(SKIN)), hand); wrist.rotation.z = 3.01; wrist.position.set(-.02, -.5, -.12);
  const sleeve = add(new THREE.Mesh(new THREE.CylinderGeometry(.46, .52, 2.4, 40), sm), hand); sleeve.rotation.z = 3.01; sleeve.position.set(-.18, -1.95, -.2);
  const palm = add(new THREE.Mesh(new THREE.SphereGeometry(.42, 40, 30), clay(SKIN)), hand); palm.scale.set(1, 1, .75); palm.position.x = -.05;
  for (let i = 0; i < 4; i++) {           // fingers wrapped round the grip, knuckles toward the viewer
    const y = .27 - i * .175, z = .3 - Math.abs(i - 1.5) * .03;
    const f = add(new THREE.Mesh(new THREE.CapsuleGeometry(.115, .3, 8, 20), clay(SKIN)), hand); f.rotation.z = Math.PI / 2; f.position.set(.08, y, z);
    const k = add(new THREE.Mesh(new THREE.SphereGeometry(.07, 16, 12), clay(SKIN)), hand); k.position.set(-.2, y + .02, z - .02);
    const nail = add(new THREE.Mesh(new THREE.SphereGeometry(.06, 16, 12), clay('#e8c9b0', { rough: .4 })), hand); nail.scale.set(.6, .75, .4); nail.position.set(.3, y, z + .07);
  }
  const thumb = add(new THREE.Mesh(new THREE.CapsuleGeometry(.1, .26, 8, 20), clay(SKIN)), hand); thumb.rotation.z = Math.PI / 2 - .25; thumb.position.set(.1, .45, .2);
  // orange plastic grip, long straight rusty blade
  const grip = add(new THREE.Mesh(new THREE.CylinderGeometry(.12, .13, 1.0, 28), clay('#e8592e', { rough: .5, bump: .4 })), hand); grip.position.set(.05, .05, .1);
  const collar = add(new THREE.Mesh(new THREE.CylinderGeometry(.15, .14, .16, 28), clay('#e8592e', { rough: .5, bump: .4 })), hand); collar.position.set(.05, .6, .1);
  const rust = (() => {
    const [c, g] = canvas(512); g.fillStyle = '#7d736a'; g.fillRect(0, 0, 512, 512);
    for (let i = 0; i < 1400; i++) { const v = rnd(); g.fillStyle = v < .5 ? `rgba(110,62,30,${.15 + rnd() * .3})` : `rgba(200,195,185,${.08 + rnd() * .15})`;
      g.beginPath(); g.ellipse(rnd() * 512, rnd() * 512, 1 + rnd() * 6, 1 + rnd() * 3, rnd() * 3, 0, 7); g.fill(); }
    g.fillStyle = 'rgba(225,222,215,.7)'; g.fillRect(0, 0, 512, 22);       // bright honed edge
    const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
  })();
  const sh = new THREE.Shape(); sh.moveTo(-.17, 0); sh.lineTo(.17, 0); sh.lineTo(.2, 3.6); sh.lineTo(-.14, 3.72); sh.closePath();
  const bg = new THREE.ExtrudeGeometry(sh, { depth: .02, bevelEnabled: true, bevelThickness: .025, bevelSize: .025, bevelSegments: 3 });
  bg.computeBoundingBox(); const bb = bg.boundingBox, uv = bg.attributes.uv, ps = bg.attributes.position;
  for (let i = 0; i < uv.count; i++) uv.setXY(i, (ps.getY(i) - bb.min.y) / (bb.max.y - bb.min.y), (ps.getX(i) - bb.min.x) / (bb.max.x - bb.min.x));
  const blade = add(new THREE.Mesh(bg, clay('#fff', { map: rust, metal: .35, rough: .6, bump: .8 })), hand); blade.position.set(.05, .66, .09); blade.rotation.y = -.3;
}
